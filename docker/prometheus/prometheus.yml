# Prometheus do docker-compose (T-02.4). No k8s a configuração é outra
# (infra/k8s/observability.yaml): lá há réplicas e a descoberta é por pod.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: core-service
    metrics_path: /metrics
    # /metrics exige Bearer METRICS_TOKEN. O Prometheus não expande variável de
    # ambiente no arquivo de config: o entrypoint do compose grava o token neste arquivo.
    authorization:
      type: Bearer
      credentials_file: /prometheus/metrics_token
    static_configs:
      - targets: ['backend:3000']

  # RabbitMQ (T-01.4/H.1, CA-01.4.f): plugin rabbitmq_prometheus, já ativo na imagem. O
  # /metrics/per-object traz a profundidade de CADA fila — inclusive a de mensagens mortas
  # (analytics.core-events.dlq), que o painel do Grafana precisa mostrar (catálogo §5.3).
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ['rabbitmq:15692']
