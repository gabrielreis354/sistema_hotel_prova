limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

upstream backend_pool {
  server backend:3000;
  keepalive 32;
}

server {
  listen 80;

  # Headers de seguranca (mesmo conteudo de infra/k8s/nginx.yaml — nao editar um sem o outro)
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 10m;

  proxy_connect_timeout  5s;
  proxy_read_timeout     60s;
  proxy_send_timeout     60s;

  location /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # Rate limiting no login — protege contra brute force
  location /auth/login {
    limit_req zone=login_limit burst=3 nodelay;
    limit_req_status 429;

    proxy_pass         http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header   Connection  "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # RNF-023: download de PDF por URL assinada. O backend assina a URL com o endereço PÚBLICO
  # (MINIO_PUBLIC_ENDPOINT); o Host faz parte da assinatura, por isso vai intacto ao MinIO.
  # Só leitura — o bucket continua privado: sem assinatura válida, o MinIO responde 403.
  # O prefixo é o MINIO_BUCKET (hotel-contracts); mudar um exige mudar o outro.
  location ^~ /hotel-contracts/ {
    limit_except GET HEAD { deny all; }
    proxy_pass         http://minio:9000;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host       $http_host;
    proxy_buffering    off;
  }

  location / {
    proxy_pass         http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade     $http_upgrade;
    proxy_set_header   Connection  "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }
}
