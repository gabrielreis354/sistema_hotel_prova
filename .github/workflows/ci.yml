name: CI

# Dispara nas branches principais E nas branches de trabalho dos agentes —
# antes, feature/* e fix/* não rodavam CI nenhum e o código quebrado só
# aparecia no merge.
on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
      - 'docs/**'
  pull_request:
    branches: [main, develop]

jobs:
  # Camada 1 do portão de QA: checagens determinísticas, sem dependência.
  # Roda em segundos e dá feedback antes da suíte completa.
  # A auditoria semântica é feita pelo subagente qa-redteam, fora do CI.
  qa:
    name: Checagens determinísticas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rodar qa_checks
        run: bash scripts/qa_checks.sh

  test:
    name: Testes + Cobertura
    runs-on: ubuntu-latest

    # O backend vive em services/core-service desde 15/09/2026 (SPEC-01).
    # Cada serviço novo ganha o seu próprio job, com filtro de caminho (T-01.5).
    defaults:
      run:
        working-directory: services/core-service

    # Banco PostgreSQL efêmero para os testes de integração.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hotel_user
          POSTGRES_PASSWORD: hotel_password
          POSTGRES_DB: gestao_hotel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotel_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: gestao_hotel_test
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: hotel_password
      PIX_WEBHOOK_SECRET: pms_hotel_test_pix_webhook_secret_ci
      # JWT RS256 (ADR-006/T-01.3) — sem arquivo de chave versionado nenhum: o
      # globalSetup dos testes gera o par nesse caminho se ele ainda não existir
      # (mesmo mecanismo do ambiente local/testes, ver tests/setup/globalSetup.js).
      JWT_PRIVATE_KEY_PATH: tests/setup/.tmp-jwt-keys/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: tests/setup/.tmp-jwt-keys/jwt-public.pem
      JWT_KEY_ID: core-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: services/core-service/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar sintaxe (ESM)
        run: |
          find app routes middlewares database -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Rodar testes + cobertura (falha abaixo de 60%)
        run: npm run test:coverage

  # analytics-service (T-01.4/H.2, T-01.5) — job próprio: o portão de 60% vale para cada serviço.
  # Roda também o teste de integração com RabbitMQ de verdade (tests/rabbitmq.integration.test.js),
  # com a topologia e os usuários do infra/k8s/rabbitmq-setup.sh, o mesmo do compose e do k8s.
  test-analytics:
    name: analytics-service — Testes + Cobertura
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/analytics-service

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hotel_user
          POSTGRES_PASSWORD: hotel_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotel_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: hotel_broker
          RABBITMQ_DEFAULT_PASS: rabbitmq_ci_password
        ports:
          - 5672:5672
        # Intervalo de 10 s antes da 1ª sonda: um rabbitmq-diagnostics (root) que roda antes do
        # broker iniciar cria o .erlang.cookie como root e o broker cai com 'eacces'.
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: services/analytics-service/package-lock.json

      - name: Topologia e usuários do RabbitMQ (rabbitmq-setup.sh)
        working-directory: .
        run: |
          docker exec -i \
            -e RABBITMQ_DEFAULT_USER=hotel_broker \
            -e RABBITMQ_DEFAULT_PASS=rabbitmq_ci_password \
            -e RABBITMQ_CORE_USER=hotel_core_publisher \
            -e RABBITMQ_CORE_PASSWORD=core_ci_password \
            -e RABBITMQ_ANALYTICS_USER=hotel_analytics_consumer \
            -e RABBITMQ_ANALYTICS_PASSWORD=analytics_ci_password \
            "${{ job.services.rabbitmq.id }}" sh -s < infra/k8s/rabbitmq-setup.sh

      # O env.js e o globalSetup carregam o .env.test com override — variável de ambiente do job
      # não chega aos testes, então o arquivo é gerado a partir do exemplo.
      - name: Gerar .env.test
        run: |
          cp .env.test.example .env.test
          sed -i \
            -e 's/^RABBITMQ_HOST=.*/RABBITMQ_HOST=localhost/' \
            -e 's/^RABBITMQ_ANALYTICS_PASSWORD=.*/RABBITMQ_ANALYTICS_PASSWORD=analytics_ci_password/' \
            -e 's/^RABBITMQ_CORE_PASSWORD=.*/RABBITMQ_CORE_PASSWORD=core_ci_password/' \
            .env.test

      - name: Instalar dependências
        run: npm ci

      - name: Verificar sintaxe (ESM)
        run: |
          find app routes middlewares database bootstrap -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Rodar testes + cobertura (falha abaixo de 60%)
        run: npm run test:coverage
