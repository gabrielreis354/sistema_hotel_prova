apiVersion: v1
kind: ConfigMap
metadata:
  name: hotel-config
  namespace: hotel-system
data:
  NODE_ENV: production
  NODE_WEB_PORT: "3000"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: gestao_hotel
  POSTGRES_USER: hotel_user
  REDIS_URL: "redis://redis:6379"
  MINIO_ENDPOINT: "http://minio:9000"
  MINIO_BUCKET: hotel-contracts
  # Endereço pelo qual o navegador chega ao nginx — só para assinar a URL de download de PDF
  # (RNF-023). Docker Desktop (LoadBalancer na 80): http://localhost. Minikube com
  # `./start.sh tunnel`: http://localhost:8080. Na nuvem: o domínio público.
  MINIO_PUBLIC_ENDPOINT: "http://localhost"
  MINIO_USE_SSL: "false"
