apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hotel-system
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - redis.yaml
  - rabbitmq.yaml
  - backend.yaml
  - nginx.yaml
  - pdb.yaml
  - minio.yaml
  - networkpolicy.yaml
  - observability.yaml
# Provisionamento do Grafana (T-02.4) — mesmos arquivos que o docker-compose monta.
configMapGenerator:
  - name: grafana-datasource
    files:
      - prometheus.yml=observability/grafana-datasource.yml
  - name: grafana-dashboard-provider
    files:
      - gesway.yml=observability/grafana-dashboards.yml
  - name: grafana-dashboards
    files:
      - gesway-dashboard.json=observability/gesway-dashboard.json
