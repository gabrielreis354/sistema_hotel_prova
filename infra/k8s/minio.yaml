apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: hotel-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: hotel-system
  labels:
    app: minio
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          # minio/minio saiu do Docker Hub em set/2026 (pulls anônimos passaram a dar 401/"denied")
          # — a distribuição oficial migrou para quay.io, mesmas tags. Bug real encontrado ao
          # validar o docker-compose.yml (T-06.4) — corrigido aqui também.
          image: quay.io/minio/minio:latest
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: hotel-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hotel-secret
                  key: MINIO_ROOT_PASSWORD
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: minio-data
              mountPath: /data
        # Bucket + usuário só de leitura que assina as URLs de download (RNF-023) —
        # infra/k8s/minio-setup.sh, o mesmo do serviço minio-setup do compose. Fica no pod do
        # MinIO, não no do backend: se a imagem não baixa ou o MinIO está fora, só o PDF fica
        # indisponível (best-effort, CA-D.2) — o PMS não depende disto para subir. Tenta até
        # dar certo e fica parado (o script é idempotente). Recebe só as credenciais do MinIO.
        - name: setup
          image: quay.io/minio/minio:latest
          command:
            - /bin/sh
            - -c
            - until /bin/sh /setup/minio-setup.sh; do sleep 10; done; exec sleep infinity
          env:
            - name: MINIO_URL
              value: http://localhost:9000
            - name: MINIO_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: hotel-config
                  key: MINIO_BUCKET
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: hotel-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hotel-secret
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_PRESIGN_USER
              valueFrom:
                secretKeyRef:
                  name: hotel-secret
                  key: MINIO_PRESIGN_USER
            - name: MINIO_PRESIGN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hotel-secret
                  key: MINIO_PRESIGN_PASSWORD
          # O `mc admin` passa de 64 Mi no pico (OOMKilled visto no minikube em 07/10); em repouso
          # o contêiner só dorme.
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: minio-setup
              mountPath: /setup
              readOnly: true
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-data
        - name: minio-setup
          configMap:
            name: minio-setup
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: hotel-system
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
    - name: s3-api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
