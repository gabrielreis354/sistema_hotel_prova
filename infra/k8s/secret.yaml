apiVersion: v1
kind: Secret
metadata:
  name: hotel-secret
  namespace: hotel-system
  annotations:
    nota: "SUBSTITUA os valores abaixo antes de aplicar em qualquer ambiente"
type: Opaque
# JWT_SECRET removido (ADR-006/T-01.3): o backend passou de HS256 (segredo
# simétrico único) para RS256 (par de chaves). A chave privada NÃO entra aqui —
# ao contrário dos segredos abaixo, versionar a privada anularia o motivo da
# migração. Ela vem do secret `jwt-rsa-keys`, gerado por ambiente e criado por
# scripts/k8s_garantir_secret_jwt.sh (infra_up.sh / start.sh up) — ver README.md.
stringData:
  POSTGRES_PASSWORD: hotel_password
  PIX_WEBHOOK_SECRET: pms_hotel_pix_webhook_secreto_academico_2026
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin123
  RABBITMQ_DEFAULT_USER: hotel_broker
  RABBITMQ_DEFAULT_PASS: rabbitmq_secreto_academico_2026
  # Observabilidade (T-02.4): token do scrape de /metrics e senha do admin do Grafana
  METRICS_TOKEN: metrics_token_academico_2026
  GRAFANA_ADMIN_PASSWORD: grafana_admin_academico_2026
