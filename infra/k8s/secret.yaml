apiVersion: v1
kind: Secret
metadata:
  name: hotel-secret
  namespace: hotel-system
  annotations:
    nota: "SUBSTITUA os valores abaixo antes de aplicar em qualquer ambiente"
type: Opaque
# JWT_SECRET removido (ADR-006/T-01.3): o backend passou de HS256 (segredo
# simétrico único) para RS256 (par de chaves). A chave privada NÃO entra aqui —
# ao contrário dos segredos abaixo, versionar a privada anularia o motivo da
# migração. Ela vem do secret `jwt-rsa-keys`, criado manualmente uma vez por
# ambiente — ver README.md, seção "Configuração e segredos no Kubernetes".
stringData:
  POSTGRES_PASSWORD: hotel_password
  PIX_WEBHOOK_SECRET: pms_hotel_pix_webhook_secreto_academico_2026
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin123
  RABBITMQ_DEFAULT_USER: hotel_broker
  # Usuário MinIO só com s3:GetObject: assina as URLs de download de PDF (RNF-023). Mesmo que
  # vaze, só lê objeto cuja chave já se conhece — não lista o bucket nem escreve.
  MINIO_PRESIGN_USER: gesway-pdf-leitor
  MINIO_PRESIGN_PASSWORD: leitura_pdf_academico_2026
  RABBITMQ_DEFAULT_PASS: rabbitmq_secreto_academico_2026
