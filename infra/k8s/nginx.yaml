apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: hotel-system
data:
  default.conf: |
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    upstream minio_s3 {
      server minio:9000;
      keepalive 8;
    }

    upstream backend_pool {
      server backend:3000;
      keepalive 32;
    }

    server {
      listen 80;

      # Headers de seguranca (alinhado com docker/nginx/default.conf)
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;

      client_max_body_size 10m;

      proxy_connect_timeout  5s;
      proxy_read_timeout     60s;
      proxy_send_timeout     60s;

      location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
      }

      # Rate limiting no login — protege contra brute force
      # (Gabriel corrigiu vuln de login multi-tenant; rate limit reforça a defesa)
      location /auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header   Connection  "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
      }

      # RNF-023: download de PDF por URL assinada, de navegador direto ao MinIO.
      # O MinIO NÃO fica exposto: só passa GET/HEAD de um objeto PDF de orçamento ou contrato
      # (<tenant>/<quotes|contracts>/<id>.pdf), com autenticação pela query (URL pré-assinada) e
      # nada além dos parâmetros X-Amz-* — listagem do bucket, ?acl, ?policy e qualquer outro
      # subrecurso caem no 403 do prefixo. Authorization e cookies do cliente são descartados: uma
      # credencial S3 trazida pelo próprio cliente não chega ao MinIO. A URL é assinada pelo
      # backend com MINIO_PUBLIC_ENDPOINT (o Host faz parte da assinatura e vai intacto) e por um
      # usuário MinIO que só tem s3:GetObject (infra/k8s/minio-setup.sh). O prefixo é o
      # MINIO_BUCKET (hotel-contracts); mudar um exige mudar o outro.
      location ~ "^/hotel-contracts/[0-9a-f-]{36}/(quotes|contracts)/[0-9a-f-]{36}\.pdf$" {
        limit_except GET HEAD { deny all; }
        if ($args !~* "^(x-amz-[a-z0-9-]+|x-id)=[^&]*(&(x-amz-[a-z0-9-]+|x-id)=[^&]*)*$") { return 403; }
        if ($args !~ "(^|&)X-Amz-Signature=[0-9a-f]{64}(&|$)") { return 403; }
        # $uri (normalizado, só [0-9a-f-/.] pela regex acima) em vez do URI cru do cliente.
        proxy_pass         http://minio_s3$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $http_host;
        proxy_set_header   Authorization     "";
        proxy_set_header   Cookie            "";
        proxy_set_header   X-Forwarded-For   "";
        proxy_set_header   X-Real-IP         "";
        proxy_set_header   X-Forwarded-Host  "";
        proxy_set_header   X-Forwarded-Proto "";
        proxy_buffering    off;
      }

      location /hotel-contracts/ {
        return 403;
      }

      location / {
        proxy_pass         http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade     $http_upgrade;
        proxy_set_header   Connection  "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: hotel-system
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: hotel-system
spec:
  type: LoadBalancer
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
