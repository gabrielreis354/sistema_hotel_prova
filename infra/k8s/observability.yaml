# Observabilidade (T-02.4) — Prometheus + Grafana no namespace hotel-system.
#
# Prometheus descobre os pods do backend pela API do Kubernetes (kubernetes_sd, role pod):
# com réplicas, raspar o Service balancearia entre pods e os contadores pulariam de um
# para outro. Descoberta por pod mede cada réplica separada.
#
# Nada aqui é exposto para fora do cluster. Acesso ao Grafana na demonstração:
#   kubectl -n hotel-system port-forward svc/grafana 3002:3000   →  http://localhost:3002
# Login: admin / GRAFANA_ADMIN_PASSWORD do hotel-secret (anônimo e cadastro desligados).
#
# Armazenamento em emptyDir, de propósito: o cluster é criado e destruído a cada sessão
# (ADR-004), então volume persistente só custaria disco sem guardar nada útil.
#
# Datasource, provider e dashboard do Grafana vêm de infra/k8s/observability/ via
# configMapGenerator (kustomization.yaml) — os mesmos arquivos que o docker-compose monta.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: hotel-system
---
# Role (não ClusterRole): só enxerga pods do próprio namespace — menor privilégio.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  namespace: hotel-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  namespace: hotel-system
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: hotel-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-discovery
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: hotel-system
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: core-service
        metrics_path: /metrics
        # /metrics exige Bearer METRICS_TOKEN — montado do hotel-secret como arquivo.
        authorization:
          type: Bearer
          credentials_file: /etc/prometheus/secrets/METRICS_TOKEN
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [hotel-system]
        relabel_configs:
          # Só os pods do backend, só a porta 3000.
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: backend
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: "3000"
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: hotel-system
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "384Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: metrics-token
              mountPath: /etc/prometheus/secrets
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: metrics-token
          secret:
            secretName: hotel-secret
            items:
              - key: METRICS_TOKEN
                path: METRICS_TOKEN
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: hotel-system
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: hotel-system
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            # CA-02.4.b — senha vem do secret; sem ela o pod não sobe (secretKeyRef obrigatório),
            # em vez de cair no padrão admin/admin.
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hotel-secret
                  key: GRAFANA_ADMIN_PASSWORD
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
      volumes:
        - name: datasource
          configMap:
            name: grafana-datasource
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: hotel-system
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
