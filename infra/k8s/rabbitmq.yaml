apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
  namespace: hotel-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 512Mi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: hotel-system
  labels:
    app: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          # Broker dos eventos do core (T-01.4): o publicador do outbox entrega aqui.
          image: rabbitmq:4-management-alpine
          ports:
            - containerPort: 5672   # AMQP
            - containerPort: 15672  # UI de gestão
            - containerPort: 15692  # métricas (plugin rabbitmq_prometheus) — profundidade das filas
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: hotel-secret
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: hotel-secret
                  key: RABBITMQ_DEFAULT_PASS
          # Probes por TCP na porta AMQP, que só abre no fim do boot. O `rabbitmq-diagnostics`
          # sobe uma VM Erlang a cada checagem: passava do timeout de 10 s com CPU limitada e somava
          # memória ao contêiner — no minikube o pod ficou em OOMKilled/reinício por dias (14/10).
          # O 1º boot leva ~1 min; o startupProbe dá até 5 min antes de a liveness valer.
          startupProbe:
            tcpSocket:
              port: 5672
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 5672
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5672
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # 256 Mi não comportava o RabbitMQ 4 com o plugin de gestão (OOMKilled no minikube).
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
        # Topologia (exchanges, filas, fila de mensagens mortas) e usuários por serviço — script
        # infra/k8s/rabbitmq-setup.sh, o mesmo do serviço rabbitmq-setup do compose. Fica no pod do
        # RabbitMQ, não no do backend: o core opera com o broker fora (CA-01.4.c), os eventos só
        # acumulam no outbox. Tenta até dar certo e fica parado (o script é idempotente).
        - name: setup
          image: rabbitmq:4-management-alpine
          # Falha é logada a cada tentativa: `kubectl -n hotel-system logs rabbitmq-0 -c setup`.
          # Até resolver, o publicador do core recebe ACCESS_REFUSED e os eventos esperam no outbox.
          # `trap` + `sleep & wait`: responde ao SIGTERM na hora, sem segurar o pod em Terminating.
          command:
            - /bin/sh
            - -c
            - |
              trap 'exit 0' TERM INT
              tentativa=0
              until /bin/sh /setup/rabbitmq-setup.sh; do
                tentativa=$((tentativa + 1))
                echo "rabbitmq-setup: FALHOU (tentativa $tentativa) — eventos do core ficam no outbox até resolver; causa nas linhas acima. Nova tentativa em 10 s." >&2
                sleep 10 & wait $!
              done
              while true; do sleep 3600 & wait $!; done
          env:
            - name: RABBITMQ_API_HOST
              value: localhost
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: hotel-secret
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: hotel-secret
                  key: RABBITMQ_DEFAULT_PASS
            - name: RABBITMQ_CORE_USER
              valueFrom:
                secretKeyRef:
                  name: hotel-secret
                  key: RABBITMQ_CORE_USER
            - name: RABBITMQ_CORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hotel-secret
                  key: RABBITMQ_CORE_PASSWORD
            - name: RABBITMQ_ANALYTICS_USER
              valueFrom:
                secretKeyRef:
                  name: hotel-secret
                  key: RABBITMQ_ANALYTICS_USER
            - name: RABBITMQ_ANALYTICS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hotel-secret
                  key: RABBITMQ_ANALYTICS_PASSWORD
          # rabbitmqadmin é um binário só, leve; em repouso o contêiner só dorme.
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          volumeMounts:
            - name: rabbitmq-setup
              mountPath: /setup
              readOnly: true
      volumes:
        - name: rabbitmq-data
          persistentVolumeClaim:
            claimName: rabbitmq-data
        - name: rabbitmq-setup
          configMap:
            name: rabbitmq-setup
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: hotel-system
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
    - name: metrics
      port: 15692
      targetPort: 15692
