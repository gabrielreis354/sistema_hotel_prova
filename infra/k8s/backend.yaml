apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: hotel-system
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: sistema-gestao-hotel-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: hotel-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hotel-secret
                  key: POSTGRES_PASSWORD
            # JWT RS256 (ADR-006/T-01.3) — a chave PRIVADA não vem do hotel-secret
            # versionado. É montada do secret `jwt-rsa-keys`, criado manualmente uma
            # vez por ambiente (kubectl create secret generic jwt-rsa-keys
            # --from-file=jwt-private.pem --from-file=jwt-public.pem -n hotel-system —
            # ver README.md). Versionar a privada anularia o motivo de sair do HS256.
            - name: JWT_PRIVATE_KEY_PATH
              value: /app/keys/jwt-private.pem
            - name: JWT_PUBLIC_KEY_PATH
              value: /app/keys/jwt-public.pem
            - name: JWT_KEY_ID
              value: core-v1
            - name: PIX_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: hotel-secret
                  key: PIX_WEBHOOK_SECRET
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: hotel-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hotel-secret
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_PRESIGN_USER
              valueFrom:
                secretKeyRef:
                  name: hotel-secret
                  key: MINIO_PRESIGN_USER
            - name: MINIO_PRESIGN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hotel-secret
                  key: MINIO_PRESIGN_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: jwt-rsa-keys
              mountPath: /app/keys
              readOnly: true
      volumes:
        - name: jwt-rsa-keys
          secret:
            secretName: jwt-rsa-keys
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: hotel-system
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
