apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: hotel-system
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
        # Job do migrate (infra/k8s/jobs/backend-migrate.yaml), criado pelo start.sh.
        - podSelector:
            matchLabels:
              app: backend-migrate
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress
  namespace: hotel-system
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-ingress
  namespace: hotel-system
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nginx
        # Prometheus raspa /metrics direto no pod (T-02.4) — o nginx barra /metrics de fora.
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-ingress
  namespace: hotel-system
spec:
  podSelector:
    matchLabels:
      app: rabbitmq
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
        # [revisão do Weslley] O consumidor do analytics lê a própria fila (T-01.4/H.3).
        - podSelector:
            matchLabels:
              app: analytics-service
      # Só AMQP: a topologia é declarada pelo contêiner `setup` dentro do próprio pod (localhost),
      # então nem o backend nem o analytics têm motivo para alcançar a UI/API de gestão (15672).
      ports:
        - protocol: TCP
          port: 5672
    # Prometheus lê a profundidade das filas, inclusive a de mensagens mortas (CA-01.4.f).
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 15692
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-ingress
  namespace: hotel-system
spec:
  podSelector:
    matchLabels:
      app: minio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
        # RNF-023: o navegador baixa o PDF pela URL assinada, via nginx (location /hotel-contracts/).
        - podSelector:
            matchLabels:
              app: nginx
      ports:
        - protocol: TCP
          port: 9000
---
# Só o Grafana consulta o Prometheus (T-02.4).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-ingress
  namespace: hotel-system
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 9090
---
# Grafana: nenhum pod do cluster precisa falar com ele. Acesso só por
# kubectl port-forward, que não passa pela rede de pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-ingress
  namespace: hotel-system
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
    - Ingress
  ingress: []
---
# [revisão do Weslley] Banco do analytics (T-01.4/H.3): só o próprio analytics-service fala com ele
# (database per service, ADR-003). O backend não alcança este banco.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analytics-postgres-ingress
  namespace: hotel-system
spec:
  podSelector:
    matchLabels:
      app: analytics-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: analytics-service
      ports:
        - protocol: TCP
          port: 5432
---
# [revisão do Weslley] analytics-service (T-01.4/H.3): só o nginx chega à porta HTTP — é por ele que
# o navegador consulta /analytics/*. O kubelet faz as probes direto no nó, fora da NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analytics-service-ingress
  namespace: hotel-system
spec:
  podSelector:
    matchLabels:
      app: analytics-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nginx
      ports:
        - protocol: TCP
          port: 3001
